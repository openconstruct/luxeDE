default_path        /usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games
default_xserver     /usr/bin/X
xserver_arguments   -nolisten tcp -deferglyphs 16
display_setup_cmd   /usr/libexec/luxedm/luxedm-display-setup
xauth_path          /usr/bin/xauth
authfile            /run/luxedm.auth

halt_cmd            /usr/bin/systemctl poweroff
reboot_cmd          /usr/bin/systemctl reboot
suspend_cmd         /usr/bin/systemctl suspend
# console_cmd is intentionally empty by default; authenticated administrators
# may set an explicit console helper here if required.

login_cmd           exec /bin/bash -login /etc/X11/Xsession %session
sessionstart_cmd     /usr/bin/sessreg -a -l "$DISPLAY" %user
sessionstop_cmd      /usr/bin/sessreg -d -l "$DISPLAY" %user
sessiondir           /usr/share/xsessions
default_session      Luxe

daemon              yes
numlock             on
hidecursor          false
wrong_passwd_timeout 1
keep_user_on_fail    1
focus_password      yes
auto_login          no

current_theme       luxe
lockfile            /run/luxedm.pid
logfile             /var/log/luxedm.log
welcome_msg         Welcome to Lumen
session_msg         Session:
shutdown_msg        The system is shutting down…
reboot_msg          The system is restarting…
