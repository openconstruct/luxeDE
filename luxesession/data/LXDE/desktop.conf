[Session]
window_manager=openbox
disable_autostart=no
panel/command=luxepanel
panel/session=LXDE
file_manager/command=pcmanager
file_manager/session=LXDE
desktop_manager/command=frame --wallpaper-daemon
polkit/command=luxepolkit
clipboard/command=luxeclipboard
xsettings_manager/command=build-in
proxy_manager/command=build-in
keyring/command=ssh-agent
quit_manager/command=luxesession-logout
lock_manager/command=luxelock
terminal_manager/command=luxeterm
quit_manager/image=/usr/share/luxesession/images/system-log-out.png
quit_manager/layout=top

[GTK]
sGtk/ThemeName=Luxe-tokyo-night
sGtk/FontName=Sans 10
sGtk/CursorThemeName=Adwaita
sGtk/Net/ThemeName=Luxe-tokyo-night
sGtk/Net/IconThemeName=Luxe-Dark
iXft/Antialias=1
iXft/Hinting=1
sXft/HintStyle=hintslight
sXft/RGBA=rgb
sNet/ThemeName=Luxe-tokyo-night
sNet/IconThemeName=Luxe-Dark
iNet/EnableEventSounds=1
iNet/EnableInputFeedbackSounds=1
sGtk/ColorScheme=
iGtk/ToolbarStyle=3
iGtk/ToolbarIconSize=3
iGtk/ButtonImages=1
iGtk/MenuImages=1
iGtk/CursorThemeSize=18

[Mouse]
AccFactor=20
AccThreshold=10
LeftHanded=0

[Keyboard]
Delay=500
Interval=30
Beep=1

[State]
guess_default=true

[Dbus]
lxde=true

[Environment]
menu_prefix=lxde-
